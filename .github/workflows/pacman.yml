
name: Galaga Profile Animation Generator

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Galaga contribution game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: parshav42
          games: galaga

      # Generate futuristic neural-network banner
      - name: Generate AI neural network banner
        shell: bash
        run: |
          mkdir -p dist

          cat > dist/neural-network.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1200" height="360"
               viewBox="0 0 1200 360">

            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#030712"/>
                <stop offset="50%" stop-color="#0B1D35"/>
                <stop offset="100%" stop-color="#020617"/>
              </linearGradient>

              <radialGradient id="node">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#00F7FF"/>
                <stop offset="100%" stop-color="#0875D1"/>
              </radialGradient>

              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

            <!-- Background grid -->
            <g stroke="#164E75" opacity=".22" stroke-width=".6">
              <path d="M0 60H1200 M0 120H1200 M0 180H1200 M0 240H1200 M0 300H1200"/>
              <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360 M600 0V360 M700 0V360 M800 0V360 M900 0V360 M1000 0V360 M1100 0V360"/>
            </g>

            <!-- Header -->
            <g font-family="Arial,sans-serif">
              <text x="55" y="52" fill="#00F7FF"
                    font-size="15" letter-spacing="4">
                PARSHAV KHOCHE
              </text>

              <text x="55" y="96" fill="#FFFFFF"
                    font-size="30" font-weight="bold">
                BUILDING INTELLIGENCE
              </text>

              <text x="55" y="124" fill="#91BBD8"
                    font-size="13" letter-spacing="2">
                MACHINE LEARNING • GENERATIVE AI • AGENTIC SYSTEMS
              </text>

              <circle cx="1115" cy="48" r="5"
                      fill="#00F7FF" filter="url(#glow)">
                <animate attributeName="opacity"
                         values="1;.2;1"
                         dur="1.8s" repeatCount="indefinite"/>
              </circle>

              <text x="1095" y="53" text-anchor="end"
                    font-size="10" fill="#9CEBFF">
                SYSTEM ONLINE
              </text>
            </g>

            <!-- Network connections -->
            <g fill="none" stroke="#00BFFF"
               stroke-width="1.4" opacity=".55">
              <path d="M90 175L280 145L460 195L650 135L840 175L1080 125"/>
              <path d="M90 230L280 245L460 195L650 240L840 205L1080 245"/>
              <path d="M90 175L280 245L460 145L650 240L840 125L1080 245"/>
              <path d="M90 230L280 145L460 245L650 135L840 245L1080 125"/>
              <path d="M280 145L460 145L650 240L840 175"/>
              <path d="M280 245L460 245L650 135L840 205"/>
            </g>

            <!-- Moving particles -->
            <g fill="#FFFFFF" filter="url(#glow)">
              <circle r="4">
                <animateMotion dur="4s" repeatCount="indefinite"
                  path="M90 175L280 145L460 195L650 135L840 175L1080 125"/>
              </circle>

              <circle r="3">
                <animateMotion dur="5s" begin="-2s" repeatCount="indefinite"
                  path="M90 230L280 245L460 195L650 240L840 205L1080 245"/>
              </circle>

              <circle r="4">
                <animateMotion dur="4.5s" begin="-1s" repeatCount="indefinite"
                  path="M90 175L280 245L460 145L650 240L840 125L1080 245"/>
              </circle>

              <circle r="3">
                <animateMotion dur="3.8s" begin="-2s" repeatCount="indefinite"
                  path="M90 230L280 145L460 245L650 135L840 245L1080 125"/>
              </circle>
            </g>

            <!-- Nodes -->
            <g fill="url(#node)" filter="url(#glow)">
              <circle cx="90" cy="175" r="9"/>
              <circle cx="90" cy="230" r="9"/>
              <circle cx="280" cy="145" r="11"/>
              <circle cx="280" cy="245" r="11"/>
              <circle cx="460" cy="145" r="11"/>
              <circle cx="460" cy="195" r="16"/>
              <circle cx="460" cy="245" r="11"/>
              <circle cx="650" cy="135" r="11"/>
              <circle cx="650" cy="240" r="11"/>
              <circle cx="840" cy="125" r="11"/>
              <circle cx="840" cy="175" r="14"/>
              <circle cx="840" cy="245" r="11"/>
              <circle cx="1080" cy="125" r="9"/>
              <circle cx="1080" cy="245" r="9"/>
            </g>

            <!-- Core pulse -->
            <circle cx="460" cy="195" r="25"
                    fill="none" stroke="#00F7FF" stroke-width="2">
              <animate attributeName="r"
                       values="20;42;20"
                       dur="2.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity"
                       values="1;.1;1"
                       dur="2.5s" repeatCount="indefinite"/>
            </circle>

            <!-- Scanning light -->
            <rect x="0" y="0" width="2" height="360"
                  fill="#00F7FF" opacity=".7">
              <animate attributeName="x"
                       values="0;1200;0"
                       dur="8s" repeatCount="indefinite"/>
            </rect>

            <!-- Footer -->
            <g font-family="Arial,sans-serif"
               fill="#8BBBD8" font-size="11"
               letter-spacing="2">
              <text x="90" y="300" text-anchor="middle">INPUT</text>
              <text x="280" y="300" text-anchor="middle">DATA</text>
              <text x="460" y="300" text-anchor="middle">AI CORE</text>
              <text x="650" y="300" text-anchor="middle">INFERENCE</text>
              <text x="840" y="300" text-anchor="middle">AGENTS</text>
              <text x="1080" y="300" text-anchor="middle">OUTPUT</text>

              <text x="600" y="340" text-anchor="middle"
                    fill="#00F7FF" font-size="12">
                FROM MACHINE LEARNING TO AUTONOMOUS INTELLIGENCE
              </text>
            </g>
          </svg>
          SVG

      # Verify assets before publishing
      - name: Verify generated assets
        run: |
          set -e
          echo "Generated assets:"
          ls -lh dist/
          test -s dist/neural-network.svg
          test -s dist/galaga-contribution-graph.svg
          test -s dist/galaga-contribution-graph-dark.svg

      # Publish everything to output branch
      - name: Publish profile animations
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
